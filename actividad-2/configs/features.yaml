# =====================================================================
# Selección de variables del experimento.
#   ALL     -> todas las variables (numéricas y categóricas)
#   NUMERIC -> solo las variables numéricas
#   CUSTOM  -> solo las que listes en `custom` (nombres exactos del CSV)
# Cada run registra en MLflow el alias (`features`) y el número de variables (`n_features`).
#
# Nota (dataset Customer-Churn-Records): `Complain` está casi 1:1 con `Exited`
# (AUC ~0.999 si se incluye). Por eso CUSTOM la deja fuera, para comparar los modelos
# en un escenario realista. Con ALL o NUMERIC sí entra.
# =====================================================================

seleccion: CUSTOM

custom:
  - CreditScore
  - Geography
  - Gender
  - Age
  - Tenure
  - Balance
  - NumOfProducts
  - IsActiveMember
  - EstimatedSalary
